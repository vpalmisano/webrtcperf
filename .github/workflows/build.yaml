name: Build

on:
  workflow_dispatch:
  push:
    tags:
    - 'v*'
    branches:
    - 'devel'
    paths:
    - 'scripts/*'
    - 'src/*'
    - '*.json'
    - '*.js'
    - 'yarn.lock'
    - 'Dockerfile*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  DEBUG_LEVEL: "INFO"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
        - linux/amd64
        #- linux/arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Cache modules
      uses: actions/cache@v4
      with:
        path: |
         node_modules
         .yarn-cache
        key: ${{ runner.os }}-node-modules-${{ hashFiles('./package.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-node-modules-${{ hashFiles('./package.json') }}-
    - name: Yarn build
      run: |
        export YARN_CACHE_FOLDER=$(pwd)/.yarn-cache
        yarn install --frozen-lockfile || yarn install --frozen-lockfile
        yarn docs

    - name: Setup Pages
      uses: actions/configure-pages@v3
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./_docs

    - name: Get package version
      id: get_package_version
      run: |
        version=$(sed -nE 's/^\s*"version": "(.*?)",$/\1/p' package.json)
        echo ::set-output name=version::${version}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ hashFiles('./Dockerfile') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.NPM_TOKEN }}

    - name: Docker build and push develop version
      if: ${{ !startsWith(github.event.ref, 'refs/tags/v') }}
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        platforms: ${{ matrix.platform }}
        tags: ghcr.io/${{ github.repository }}:devel
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new
        outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=WebRTC performance and quality evaluation tool.

    - name: Docker build and push new version
      if: startsWith(github.event.ref, 'refs/tags/v')
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        platforms: ${{ matrix.platform }}
        tags: ghcr.io/${{ github.repository }}:${{ steps.get_package_version.outputs.version }},ghcr.io/${{ github.repository }}:latest
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new
        outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=WebRTC performance and quality evaluation tool.

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
